<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyGuard AI - Gateway Authentication</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15), transparent 70%), var(--bg-dark);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-out;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .auth-brand .brand-icon {
      width: 54px;
      height: 54px;
      font-size: 1.5rem;
    }
    .auth-brand h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--radius-sm);
      padding: 0.25rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }
    .auth-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 10px var(--primary-glow);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .alert-banner {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-banner.danger {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .alert-banner.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">PG</div>
      <h1>PrivacyGuard AI</h1>
      <p>Privacy-Aware AI Decision & Action Gateway</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthMode('login')">Sign In</button>
      <button class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthMode('register')">Register Account</button>
    </div>

    <div id="alert-box" class="alert-banner"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="e.g. vijay@privacyguard.ai" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="login-password" style="margin-bottom: 0;">Password</label>
          <a href="#" id="forgot-password-link" onclick="switchAuthMode('forgot')" style="font-size: 0.775rem; color: var(--primary); text-decoration: none;">Forgot Password?</a>
        </div>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.5rem;">
        Authenticate & Launch Console →
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Vijay Ragavan" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Work Email</label>
        <input type="email" id="reg-email" class="form-control" placeholder="e.g. user@privacyguard.ai" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.5rem;">
        Create Account & Log In →
      </button>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgot-form" style="display: none;">
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.4;">
        Enter your registered email address and we will dispatch a secure, 15-minute expiring password reset link via EmailJS.
      </p>

      <div class="form-group">
        <label for="forgot-email">Account Email</label>
        <input type="email" id="forgot-email" class="form-control" placeholder="e.g. vijay@privacyguard.ai" required>
      </div>

      <button type="submit" id="forgot-submit-btn" class="btn btn-warning" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.5rem;">
        Send Password Reset Email →
      </button>

      <div style="text-align: center; margin-top: 1rem;">
        <a href="#" onclick="switchAuthMode('login')" style="font-size: 0.825rem; color: var(--text-muted); text-decoration: none;">← Back to Sign In</a>
      </div>
    </form>

    <div class="auth-footer">
      🔒 Protected by Deterministic Gateway JWT Authentication
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
