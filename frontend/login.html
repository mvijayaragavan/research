<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyGuard AI - Security Gateway Authentication</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-app);
      padding: 1.5rem;
      color: var(--text-main);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.3s ease-out;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .auth-brand .brand-icon {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .auth-brand h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
      margin-top: 0.25rem;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: var(--radius-sm);
      padding: 0.2rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }
    .auth-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.55rem;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .auth-tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 1.15rem;
    }
    .form-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .alert-banner {
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.15rem;
      display: none;
    }
    .alert-banner.danger {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-banner.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">🛡️</div>
      <h1>PrivacyGuard Workspace</h1>
      <p>Secure Enterprise Document Management Console</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthMode('login')">Sign In</button>
      <button class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthMode('register')">Register Account</button>
    </div>

    <div id="alert-box" class="alert-banner"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="e.g. vijay@privacyguard.ai" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label for="login-password" style="margin-bottom: 0;">Password</label>
          <a href="#" id="forgot-password-link" onclick="switchAuthMode('forgot')" style="font-size: 0.775rem; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">
        Authenticate & Sign In →
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" class="form-control" placeholder="e.g. Vijayaragavan M" required>
      </div>

      <div class="form-group">
        <label for="register-email">Email Address</label>
        <input type="email" id="register-email" class="form-control" placeholder="e.g. vijay@privacyguard.ai" required>
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">
        Create Account & Sign In →
      </button>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgot-form" style="display: none;">
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.4;">
        Enter your registered account email address below. We will dispatch a single-use password recovery link to your inbox.
      </p>

      <div class="form-group">
        <label for="forgot-email">Account Email Address</label>
        <input type="email" id="forgot-email" class="form-control" placeholder="e.g. vijay@privacyguard.ai" required>
      </div>

      <button type="submit" id="forgot-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">
        Send Recovery Link →
      </button>

      <div style="text-align: center; margin-top: 1rem;">
        <a href="#" onclick="switchAuthMode('login')" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">← Return to Sign In</a>
      </div>
    </form>

    <div class="auth-footer">
      🔒 Enterprise AES-256 Grounded Document Security Gateway
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
