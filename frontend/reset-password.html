<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyGuard AI - Reset Password</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15), transparent 70%), var(--bg-dark);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-out;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .auth-brand .brand-icon {
      width: 54px;
      height: 54px;
      font-size: 1.5rem;
    }
    .auth-brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .alert-banner {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      line-height: 1.4;
    }
    .alert-banner.danger {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .alert-banner.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-dim);
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.25rem;
      font-size: 0.825rem;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">PG</div>
      <h1>Reset Your Password</h1>
      <p>Secure Account Password Recovery</p>
    </div>

    <div id="alert-box" class="alert-banner"></div>

    <div id="loading-spinner" style="text-align: center; padding: 1.5rem; color: var(--text-muted);">
      <p style="font-size: 0.9rem;">Verifying password reset link security token...</p>
    </div>

    <!-- Reset Password Form -->
    <form id="reset-password-form" style="display: none;">
      <div class="user-badge">
        <span>👤 Account Email:</span>
        <strong id="target-user-email" style="color: var(--text-main);">...</strong>
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required minlength="6">
      </div>

      <button type="submit" id="reset-submit-btn" class="btn btn-success" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.5rem;">
        Update Password & Sign In →
      </button>
    </form>

    <div id="invalid-token-actions" style="display: none; text-align: center; margin-top: 1rem;">
      <a href="login.html" class="btn" style="width: 100%; justify-content: center; padding: 0.8rem; background: var(--bg-surface);">
        ← Return to Sign In / Request New Link
      </a>
    </div>

    <div class="auth-footer">
      🔒 Single-use cryptographic reset token verified by Gateway
    </div>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
