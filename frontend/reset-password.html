<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyGuard AI - Reset Password</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-app);
      padding: 1.5rem;
      color: var(--text-main);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.3s ease-out;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .auth-brand .brand-icon {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: #ffffff;
      border-radius: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .auth-brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
      margin-top: 0.25rem;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 1.15rem;
    }
    .form-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .alert-banner {
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.15rem;
      display: none;
      line-height: 1.4;
    }
    .alert-banner.danger {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-banner.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-dim);
    }
    .user-badge-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.25rem;
      font-size: 0.825rem;
      color: #1e40af;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">🔑</div>
      <h1>Reset Password</h1>
      <p>Secure Account Password Recovery</p>
    </div>

    <div id="alert-box" class="alert-banner"></div>

    <div id="loading-spinner" style="text-align: center; padding: 1.5rem; color: var(--text-muted);">
      <p style="font-size: 0.875rem;">Verifying password reset security token...</p>
    </div>

    <!-- Reset Password Form -->
    <form id="reset-password-form" style="display: none;">
      <div class="user-badge-box">
        <span>👤 Account:</span>
        <strong id="target-user-email" style="color: var(--text-main);">...</strong>
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required minlength="6">
      </div>

      <button type="submit" id="reset-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">
        Update Password & Sign In →
      </button>
    </form>

    <div id="invalid-token-actions" style="display: none; text-align: center; margin-top: 1rem;">
      <a href="login.html" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 0.75rem;">
        ← Return to Sign In / Request New Link
      </a>
    </div>

    <div class="auth-footer">
      🔒 Single-use cryptographic reset token verified
    </div>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
