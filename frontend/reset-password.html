<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadDocX — Reset Password</title>
  <meta name="application-name" content="ReadDocX">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-family);
    }
    .carbon-login-header {
      background: var(--carbon-black);
      height: 48px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #393939;
    }
    .carbon-login-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.2px;
    }
    .reset-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 2.25rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .auth-brand .brand-icon {
      width: 44px;
      height: 44px;
      background: #edf5ff;
      color: var(--primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d0e2ff;
    }
    .auth-brand h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 0.25rem;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 1.15rem;
    }
    .form-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .alert-banner {
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.15rem;
      display: none;
      line-height: 1.4;
    }
    .alert-banner.danger {
      background: #fff1f1;
      color: #da1e28;
      border: 1px solid #ffb3b8;
    }
    .alert-banner.success {
      background: #def8ee;
      color: #198038;
      border: 1px solid #a7f0d1;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.775rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .user-badge-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #edf5ff;
      border: 1px solid #d0e2ff;
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.25rem;
      font-size: 0.825rem;
      color: #0043ce;
    }
  </style>
</head>
<body>

  <!-- Top Dark Header -->
  <header class="carbon-login-header">
    <div class="carbon-login-brand">
      <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>ReadDocX</span>
    </div>
  </header>

  <main class="reset-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg class="svg-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Reset Password</h1>
        <p>Secure Account Password Recovery</p>
      </div>

      <div id="alert-box" class="alert-banner"></div>

      <div id="loading-spinner" style="text-align: center; padding: 1.5rem; color: var(--text-muted);">
        <p style="font-size: 0.875rem;">Verifying password reset security token...</p>
      </div>

      <!-- Reset Password Form -->
      <form id="reset-password-form" style="display: none;">
        <div class="user-badge-box">
          <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Account:</span>
          <strong id="target-user-email" style="color: var(--text-main);">...</strong>
        </div>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required minlength="6">
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">
          Update Password & Sign In →
        </button>
      </form>

      <div id="invalid-token-actions" style="display: none; text-align: center; margin-top: 1rem;">
        <a href="login.html" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 0.75rem;">
          ← Return to Sign In / Request New Link
        </a>
      </div>

      <div class="auth-footer">
        <svg class="svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Single-use cryptographic reset token verified</span>
      </div>
    </div>
  </main>

  <script src="js/reset-password.js"></script>
</body>
</html>
